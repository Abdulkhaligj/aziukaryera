name: Admin Quality Gate

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'tests/**'
      - 'student-web/**'
      - 'supabase/**'
      - 'deploy/**'
      - 'server/**'
      - 'package*.json'
      - 'next.config.mjs'
      - '.github/workflows/admin-quality.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'tests/**'
      - 'student-web/**'
      - 'supabase/**'
      - 'deploy/**'
      - 'server/**'
      - 'package*.json'
      - 'next.config.mjs'
      - '.github/workflows/admin-quality.yml'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Security regression checks
        run: node --test tests/*.test.mjs
      - name: TypeScript type check
        run: npm run typecheck
      - name: Deploy kit shell syntax
        run: for f in deploy/*/scripts/*.sh; do bash -n "$f"; done
      - name: Production build
        run: npm run build

  api:
    # The MySQL API (server/): typecheck and the integration tests against a
    # throwaway MySQL 8.4, as on the university server.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts
      - name: API type check
        run: npm run typecheck
      - name: API integration tests
        run: npm test
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3307
