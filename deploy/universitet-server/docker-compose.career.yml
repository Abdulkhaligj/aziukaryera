# ASOIU Career additions on top of the official self-hosted compose.
# Loaded through COMPOSE_FILE in .env (00-prepare-server.sh sets it).
services:
  db:
    # Same Postgres build as the cloud project, so its dump restores unchanged.
    image: supabase/postgres:17.6.1.166

  functions:
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-3.6-flash,gemini-3.5-flash-lite}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      MODERATION_WEBHOOK_SECRET: ${MODERATION_WEBHOOK_SECRET:-}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://asoiu-career.vercel.app/}
