# ASOIU Karyera — MySQL backend on the university server: MySQL 8.4, the API
# (auth, data, RPC, storage, Edge Functions, jobs) and Caddy for HTTPS.
# Only Caddy publishes ports (80/443); MySQL and the API stay internal.
name: asoiu-career
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?kit.env}
      MYSQL_DATABASE: asoiu_career
      MYSQL_USER: asoiu
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?kit.env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_as_ci
      - --default-time-zone=+00:00
      - --log-bin-trust-function-creators=1
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30

  api:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    image: asoiu-career-api
    restart: unless-stopped
    env_file: api.env
    environment:
      MYSQL_URL: mysql://asoiu:${MYSQL_PASSWORD}@mysql:3306/asoiu_career
      API_EXTERNAL_URL: https://${API_DOMAIN:?kit.env}
    volumes:
      - storage:/data/storage
    depends_on:
      mysql:
        condition: service_healthy

  # Only during scripts/02-import.sh (profile "import"): a throwaway Postgres
  # that reads the final backup of the old database. No ports, no volume.
  pgrestore:
    image: postgres:17
    profiles: ["import"]
    environment:
      POSTGRES_PASSWORD: ${PGRESTORE_PASSWORD:-unused}
    volumes:
      - ${IMPORT_BACKUP_DIR:-./import-backup}:/backup:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]

volumes:
  mysql-data:
  storage:
  caddy-data:
  caddy-config:
