<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ADNSU Karyera — texniki işlər</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f3f5fb; color: #1b2440;
    }
    main {
      width: 100%; max-width: 520px; background: #fff; border-radius: 20px; padding: 36px 28px;
      box-shadow: 0 12px 40px rgba(20, 30, 80, .10); text-align: center;
    }
    .badge {
      width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 18px; display: grid; place-items: center;
      background: #0b1f6b; color: #fff; font-size: 30px; font-weight: 700;
    }
    h1 { font-size: 24px; line-height: 1.3; margin: 0 0 12px; }
    p { font-size: 16px; line-height: 1.6; margin: 0 0 10px; color: #4a5470; }
    .en { margin-top: 22px; padding-top: 18px; border-top: 1px solid #e6e9f2; font-size: 14px; }
    a { color: #0b1f6b; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <div class="badge" aria-hidden="true">A</div>
    <h1>Sayt yenilənir</h1>
    <p>ADNSU Karyera Mərkəzinin platforması yeni serverə köçürülür. Tezliklə yenidən açılacaq.</p>
    <p>Suallarınız üçün: <a href="mailto:career@asoiu.edu.az">career@asoiu.edu.az</a></p>
    <p class="en">The ADNSU Career platform is moving to a new server and will be back soon.</p>
  </main>
</body>
</html>
